function useAutoResize() {
  const ref = useRef(null);
  const notify = useCallback(() => {
    if (!ref.current) return;
    const h = ref.current.scrollHeight + 16;
    window.parent.postMessage({ type: "resize", height: h }, "*");
    try { if (window.frameElement) window.frameElement.style.height = h + "px"; } catch(e) {}
  }, []);
  useEffect(() => {
    notify();
    const obs = new MutationObserver(notify);
    if (ref.current) obs.observe(ref.current, { childList: true, subtree: true, attributes: true });
    window.addEventListener("resize", notify);
    return () => { obs.disconnect(); window.removeEventListener("resize", notify); };
  }, [notify]);
  return ref;
}

/* ═══════ COMPONENTS ═══════ */

function RadarChart({ scores, dims, accent }) {
  const size = 230, center = size / 2, maxR = center - 28, levels = 5;
  const step = (2 * Math.PI) / dims.length, start = -Math.PI / 2;
  const pt = (i, v) => {
    const a = start + i * step, r = (v / 5) * maxR;
    return { x: center + r * Math.cos(a), y: center + r * Math.sin(a) };
  };
  const grid = Array.from({ length: levels }, (_, i) => {
    const r = ((i + 1) / levels) * maxR;
    return dims.map((_, j) => {
      const a = start + j * step;
      return `${center + r * Math.cos(a)},${center + r * Math.sin(a)}`;
    }).join(" ");
  });
  const data = dims.map((d, i) => { const p = pt(i, scores[d.id] || 0); return `${p.x},${p.y}`; }).join(" ");
  const labels = dims.map((d, i) => {
    const a = start + i * step, r = maxR + 20;
    return { x: center + r * Math.cos(a), y: center + r * Math.sin(a), icon: d.icon };
  });
  return (
    <svg viewBox={`0 0 ${size} ${size}`} style={{ width: "100%", maxWidth: 230, margin: "0 auto", display: "block" }}>
      {grid.map((pts, i) => <polygon key={i} points={pts} fill="none" stroke={i === levels - 1 ? "#aaa" : "#d6d1cb"} strokeWidth={i === levels - 1 ? 1 : 0.5} />)}
      {dims.map((_, i) => { const p = pt(i, 5); return <line key={i} x1={center} y1={center} x2={p.x} y2={p.y} stroke="#d6d1cb" strokeWidth={0.5} />; })}
      <polygon points={data} fill={`${accent}20`} stroke={accent} strokeWidth={2} />
      {dims.map((d, i) => { const p = pt(i, scores[d.id] || 0); return <circle key={i} cx={p.x} cy={p.y} r={4} fill={d.color} stroke="#fff" strokeWidth={1.5} />; })}
      {labels.map((lp, i) => <text key={i} x={lp.x} y={lp.y} textAnchor="middle" dominantBaseline="central" fontSize="14">{lp.icon}</text>)}
    </svg>
  );
}

function ScaleBtn({ value, selected, onClick, color }) {
  const on = selected === value;
  const [hov, setHov] = useState(false);
  return (
    <button onClick={() => onClick(value)} onMouseOver={() => setHov(true)} onMouseOut={() => setHov(false)}
      style={{
        width: 42, height: 42, borderRadius: "50%",
        border: on ? `2.5px solid ${color}` : `2px solid ${hov ? "#999" : "#bbb"}`,
        background: on ? color : hov ? "#f0f0f0" : "#fafafa",
        color: on ? "#fff" : "#666", fontWeight: 700, fontSize: 14,
        transition: "all 0.2s ease",
        transform: on ? "scale(1.1)" : "scale(1)",
        boxShadow: on ? `0 2px 8px ${color}44` : "none", outline: "none",
      }}>
      {value}
    </button>
  );
}

function MapFlow({ mapData, onSwitchTab }) {
  const [phase, setPhase] = useState("intro");
  const [dimIdx, setDimIdx] = useState(0);
  const [qIdx, setQIdx] = useState(0);
  const [answers, setAnswers] = useState({});
  const [vis, setVis] = useState(true);

  const dims = mapData.dims;
  const total = dims.reduce((a, d) => a + d.questions.length, 0);
  const answered = Object.keys(answers).length;
  const dim = dims[dimIdx];
  const key = dim ? `${dim.id}-${qIdx}` : "";

  const go = (fn) => { setVis(false); setTimeout(() => { fn(); setVis(true); }, 130); };

  const answer = (v) => {
    setAnswers({ ...answers, [key]: v });
    setTimeout(() => {
      if (qIdx < dim.questions.length - 1) go(() => setQIdx(qIdx + 1));
      else if (dimIdx < dims.length - 1) go(() => { setDimIdx(dimIdx + 1); setQIdx(0); });
      else go(() => setPhase("results"));
    }, 220);
  };

  const back = () => {
    if (qIdx > 0) go(() => setQIdx(qIdx - 1));
    else if (dimIdx > 0) go(() => { setDimIdx(dimIdx - 1); setQIdx(dims[dimIdx - 1].questions.length - 1); });
  };

  const scores = (() => {
    const s = {};
    dims.forEach(d => {
      const vals = d.questions.map((_, qi) => answers[`${d.id}-${qi}`] || 0);
      s[d.id] = vals.reduce((a, b) => a + b, 0) / vals.length;
    });
    return s;
  })();

  const avg = Object.values(scores).reduce((a, b) => a + b, 0) / dims.length;
  const level = (sc) => sc <= 2.3 ? "low" : sc <= 3.7 ? "mid" : "high";

                <div style={{ display: "flex", alignItems: "center", gap: 5 }}>
                  <span style={{ fontSize: 15 }}>{d.icon}</span>
                  <span style={{ fontSize: 12, fontWeight: 700, color: "#222" }}>{d.label}</span>
                </div>
                <span style={{ fontSize: 14, fontWeight: 700, color: d.color }}>{sc.toFixed(1)}</span>
              </div>
              <div style={{ height: 3, background: "#ddd", borderRadius: 2, marginBottom: 8, overflow: "hidden" }}>
                <div style={{ height: "100%", width: `${bw}%`, background: `linear-gradient(90deg, ${d.color}88, ${d.color})`, borderRadius: 2, transition: "width 0.8s" }} />
              </div>
              <p style={{ fontSize: 12, lineHeight: 1.65, color: "#444", margin: 0 }}>{d.feedback[level(sc)]}</p>
            </div>
          );
        })}

        <div style={{ padding: "18px 18px", background: accent, borderRadius: 11, textAlign: "center", marginBottom: 8, boxShadow: `0 2px 10px ${accent}28` }}>
          <p style={{ fontSize: 13, color: "#fff", lineHeight: 1.65, margin: 0, fontWeight: 500 }}>{mapData.cta}</p>
          {mapData.ctaButton && <p style={{ fontSize: 15, color: "#fff", margin: "10px 0 0", fontWeight: 700 }}>{mapData.ctaButton}</p>}
          {mapData.key === "depois" && (
            <p style={{ fontSize: 12, color: "#ffffffdd", lineHeight: 1.65, margin: "10px 0 0", fontStyle: "italic" }}>
              Saber o b\u00e1sico de contabilidade n\u00e3o \u00e9 virar contador de si mesmo \u2014 \u00e9 aprender a reconhecer o enredo material da pr\u00f3pria exist\u00eancia.
            </p>
          )}
        </div>

        <div style={{ display: "flex", justifyContent: "center", gap: 8, padding: "6px 0" }}>
          <button onClick={restart} style={{ background: "#fffdf9", border: "1.5px solid #bbb", borderRadius: 7, padding: "8px 18px", fontSize: 12, fontWeight: 600, color: "#666", transition: "all 0.3s" }}
            onMouseOver={e => { e.target.style.borderColor = accent; e.target.style.color = accent; }}
            onMouseOut={e => { e.target.style.borderColor = "#bbb"; e.target.style.color = "#666"; }}
          >↻ Refazer</button>
          {mapData.key === "antes" && (
            <button onClick={() => onSwitchTab("depois")} style={{ background: MAPS.depois.color, border: "none", borderRadius: 7, padding: "8px 18px", fontSize: 12, fontWeight: 700, color: "#fff", boxShadow: `0 2px 6px ${MAPS.depois.color}40`, transition: "filter 0.3s" }}
              onMouseOver={e => e.target.style.filter = "brightness(0.9)"}
              onMouseOut={e => e.target.style.filter = "none"}
            >{MAPS.depois.icon} Mapa Depois →</button>
          )}
        </div>
      </div>
    </div>
  );
}

/* ═══════ MAIN ═══════ */

function App() {
  const [activeTab, setActiveTab] = useState("antes");
  const wrapRef = useAutoResize();

  return (
    <div ref={wrapRef} style={{ background: "#f7f3ee", padding: "12px 10px 8px" }}>
      <div style={{ maxWidth: 500, margin: "0 auto" }}>
        <div style={{ textAlign: "center", marginBottom: 4 }}>
          <p style={{ fontSize: 10, color: "#666", letterSpacing: 1.5, textTransform: "uppercase", margin: 0 }}>Psicologias em Dia · Sentir, Pensar e Transformar</p>
        </div>
        <div style={{ display: "flex", gap: 5, marginBottom: 3, justifyContent: "center" }}>
          {["antes", "depois"].map(t => {
            const m = MAPS[t], active = activeTab === t;
            return (
              <button key={t} onClick={() => setActiveTab(t)} style={{
                padding: "8px 16px", borderRadius: 7,
                background: active ? m.color : "#fffdf9",
                color: active ? "#fff" : "#777",
                border: active ? "none" : "1.5px solid #ccc",
                fontSize: 11, fontWeight: 700,
                boxShadow: active ? `0 2px 8px ${m.color}28` : "none",
                transition: "all 0.25s ease",
              }}>
                {m.tab}
              </button>
            );
          })}
        </div>
        <MapFlow key={activeTab} mapData={MAPS[activeTab]} onSwitchTab={setActiveTab} />
        <p style={{ textAlign: "center", fontSize: 10, color: "#666", marginTop: 3, paddingBottom: 6 }}>
          © Psicologias em Dia · Ferramenta de autorreflexão — não substitui avaliação ou consultoria profissional.
        </p>
      </div>
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById("root"));
</script>
</body>
</html>
