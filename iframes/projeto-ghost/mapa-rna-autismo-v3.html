<style>*{margin:0;padding:0;box-sizing:border-box}html,body{font-family:'Libre Baskerville','Georgia',serif;-webkit-font-smoothing:antialiased;background:#f7f3ee;overflow-x:hidden}button{font-family:inherit;cursor:pointer}@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}.fade-up{animation:fadeUp 0.3s ease forwards}</style>

const{useState,useEffect,useRef,useCallback}=React;
function useAutoResize(){const ref=useRef(null);const notify=useCallback(()=>{if(!ref.current)return;const h=ref.current.scrollHeight+16;window.parent.postMessage({type:"resize",height:h},"*");try{if(window.frameElement)window.frameElement.style.height=h+"px"}catch(e){}},[]);useEffect(()=>{notify();const obs=new MutationObserver(notify);if(ref.current)obs.observe(ref.current,{childList:true,subtree:true,attributes:true});window.addEventListener("resize",notify);return()=>{obs.disconnect();window.removeEventListener("resize",notify)}},[notify]);return ref}

const MAPS={
antes:{key:"antes",label:"ANTES DA LEITURA",tab:"\u{1F50D} Antes",color:"#5B2C8E",icon:"\u{1F50D}",

dims:[
{id:"compreensao",label:"Compreensão do Autismo",icon:"\u{1F9E9}",color:"#5B2C8E",tagline:"O que sei sobre TEA?",
questions:["Sei que o autismo não é uma condição única, mas um espectro com causas e manifestações muito diversas.","Entendo que existe uma diferença entre autismo de base comportamental e autismo causado por mutações genéticas específicas.","Consigo distinguir entre tratar sintomas (como ansiedade ou insônia) e tratar a causa biológica de uma condição.","Tenho alguma familiaridade com termos como \u201Cgenética\u201D, \u201CDNA\u201D e \u201CRNA\u201D, mesmo que básica."],
feedback:{low:"A maioria das pessoas sabe pouco sobre a complexidade genética do autismo — e isso é normal. O artigo foi escrito para tornar esse universo acessível. Preste atenção na seção que explica por que não existe \u201Cum\u201D autismo.",mid:"Você já possui uma base. A leitura pode refinar distinções importantes — como a diferença entre haploinsuficiência e ganho de função.",high:"Sua compreensão parece consistente. Leia buscando nuances técnicas — especialmente como cada ferramenta molecular atua de forma diferente."}},
{id:"ciencia",label:"Abertura à Ciência",icon:"\u{1F52C}",color:"#2E75B6",tagline:"Como me relaciono com informação científica?",
questions:["Consigo ler artigos de divulgação científica sem desistir quando encontro termos técnicos.","Acredito que a ciência avança por etapas e que resultados promissores não significam curas imediatas.","Busco fontes confiáveis quando quero entender um tema de saúde, ao invés de depender apenas de redes sociais.","Sinto curiosidade genuína por descobertas científicas, mesmo em áreas fora do meu domínio."],
feedback:{low:"A ciência pode parecer intimidante, mas o artigo usa metáforas (fábrica, quebra-cabeças, míssil molecular) para traduzir conceitos complexos. Leia sem pressão de entender tudo.",mid:"Você já tem abertura à ciência. O artigo pode ser uma boa oportunidade para exercitar a leitura de termos técnicos com apoio do glossário incluído.",high:"Sua relação com informação científica é um recurso valioso. Aproveite para aprofundar mecanismos específicos como ASOs, SINEUPs e edição por ADAR."}},
{id:"etica",label:"Sensibilidade Ética",icon:"\u{1F49A}",color:"#27AE60",tagline:"Como penso sobre neurodiversidade e tratamento?",
questions:["Acredito que respeitar a neurodiversidade e buscar aliviar o sofrimento de condições graves não são posições contraditórias.","Entendo que nem todo autismo \u201Cprecisa\u201D de correção — mas que formas sindrômicas graves envolvem sofrimento físico real.","Consigo refletir sobre questões éticas em saúde sem cair em posições extremas (tudo é bom ou tudo é perigoso).","Penso que o acesso a tratamentos avançados deveria ser uma preocupação coletiva, não apenas individual."],
feedback:{low:"Questões éticas sobre neurodiversidade são complexas e é normal ter dúvidas. O artigo dedica uma seção inteira a esse tema, distinguindo respeito à diferença e alívio de sofrimento orgânico.",mid:"Você já demonstra sensibilidade ética. A leitura pode ajudar a articular melhor essa posição, especialmente na distinção entre \u201Cnormalizar\u201D e \u201Capaziguar sofrimento\u201D.",high:"Sua reflexão ética é madura. Veja no artigo como a questão econômica (custo das terapias N-of-1) adiciona uma camada de justiça social a esse debate."}}
]},
depois:{key:"depois",label:"APÓS A LEITURA",tab:"\u{1F331} Depois",color:"#C0392B",icon:"\u{1F331}",
subtitle:"O que a leitura transformou?",
intro:"Agora que leu, responda com sinceridade. Observe o que mudou — mesmo sutilmente.",
resultTitle:"Seu Mapa Pós-Leitura",resultSubtitle:"Compare com o anterior. Onde a leitura moveu você?",
cta:"As diferenças revelam onde a leitura ampliou sua compreensão. Ciência é construção contínua — assim como o autoconhecimento.",ctaButton:null,
dims:[
{id:"letramento",label:"Letramento Molecular",icon:"\u{1F9EC}",color:"#C0392B",tagline:"Entendo a lógica das terapias de RNA?",
questions:["Consigo explicar, em termos simples, a diferença entre terapia gênica (que altera o DNA) e terapia de RNA (que corrige a leitura).","Entendo por que os ASOs são comparados a \u201Cmísseis moleculares\u201D — são projetados para alvos específicos.","Compreendo que haploinsuficiência (proteína insuficiente) e ganho de função (proteína tóxica) pedem estratégias opostas.","Entendo por que a barreira hematoencefálica é o maior obstáculo prático dessas terapias."],
feedback:{low:"Esses conceitos são novos para a maioria. Releia as seções sobre ferramentas moleculares e consulte o glossário — cada releitura sedimenta uma camada a mais.",mid:"Você absorveu os fundamentos. Para consolidar, tente explicar a alguém como funciona um ASO — ensinar é a forma mais poderosa de aprender.",high:"Seu letramento molecular cresceu significativamente. Você agora tem base para acompanhar notícias sobre terapias de RNA com olhar crítico e informado."}},

feedback:{low:"É natural sentir entusiasmo com descobertas impactantes. Pensamento crítico não é ceticismo — é celebrar avanços sem ignorar limites. Releia a seção sobre obstáculos.",mid:"Você já equilibra esperança com realismo. Reforce acompanhando fontes científicas diretas ao invés de apenas manchetes.",high:"Seu pensamento crítico é sólido. Você está preparado(a) para acompanhar esse campo com o equilíbrio entre esperança e rigor."}},

questions:["Acredito que estamos no início de uma transformação real na neuropsiquiatria — da gestão de sintomas à correção de causas.","Entendo que democratizar o acesso (como o diplotyping) é tão importante quanto desenvolver a tecnologia em si.","Percebo que o cérebro preserva plasticidade e pode responder a correções moleculares mesmo após anos de desenvolvimento comprometido.","Sinto que esse tipo de conhecimento deveria ser mais acessível ao público geral, não apenas a especialistas."],
feedback:{low:"O futuro dessas terapias pode parecer distante, mas o artigo mostra que as provas de conceito já existem — a ponte está sendo construída. Acompanhar essa evolução é cidadania científica.",mid:"Você já vê o potencial. Continue acompanhando — cada ensaio clínico aprovado aproxima essas terapias da realidade de famílias que vivem com autismo sindrômico grave.",high:"Sua visão de futuro é informada e esperançosa sem ser ingênua. Como diz o artigo: essa ponte, uma vez construída, não será desfeita."}}
]}};

function RadarChart({scores,dims,accent}){const size=230,center=size/2,maxR=center-28,levels=5;const step=(2*Math.PI)/dims.length,start=-Math.PI/2;const pt=(i,v)=>{const a=start+i*step,r=(v/5)*maxR;return{x:center+r*Math.cos(a),y:center+r*Math.sin(a)}};const grid=Array.from({length:levels},(_,i)=>{const r=((i+1)/levels)*maxR;return dims.map((_,j)=>{const a=start+j*step;return`${center+r*Math.cos(a)},${center+r*Math.sin(a)}`}).join(" ")});const data=dims.map((d,i)=>{const p=pt(i,scores[d.id]||0);return`${p.x},${p.y}`}).join(" ");const labels=dims.map((d,i)=>{const a=start+i*step,r=maxR+20;return{x:center+r*Math.cos(a),y:center+r*Math.sin(a),icon:d.icon}});return(<svg viewBox={`0 0 ${size} ${size}`} style={{width:"100%",maxWidth:230,margin:"0 auto",display:"block"}}>{grid.map((pts,i)=><polygon key={i} points={pts} fill="none" stroke={i===levels-1?"#aaa":"#d6d1cb"} strokeWidth={i===levels-1?1:0.5}/>)}{dims.map((_,i)=>{const p=pt(i,5);return<line key={i} x1={center} y1={center} x2={p.x} y2={p.y} stroke="#d6d1cb" strokeWidth={0.5}/>})}<polygon points={data} fill={`${accent}20`} stroke={accent} strokeWidth={2}/>{dims.map((d,i)=>{const p=pt(i,scores[d.id]||0);return<circle key={i} cx={p.x} cy={p.y} r={4} fill={d.color} stroke="#fff" strokeWidth={1.5}/>})}{labels.map((lp,i)=><text key={i} x={lp.x} y={lp.y} textAnchor="middle" dominantBaseline="central" fontSize="14">{lp.icon}</text>)}</svg>)}
function ScaleBtn({value,selected,onClick,color}){const on=selected===value;const[hov,setHov]=useState(false);return(<button onClick={()=>onClick(value)} onMouseOver={()=>setHov(true)} onMouseOut={()=>setHov(false)} style={{width:42,height:42,borderRadius:"50%",border:on?`2.5px solid ${color}`:`2px solid ${hov?"#999":"#bbb"}`,background:on?color:hov?"#f0f0f0":"#fafafa",color:on?"#fff":"#666",fontWeight:700,fontSize:14,transition:"all 0.2s ease",transform:on?"scale(1.1)":"scale(1)",boxShadow:on?`0 2px 8px ${color}44`:"none",outline:"none"}}>{value}</button>)}

function MapFlow({mapData,onSwitchTab}){const[phase,setPhase]=useState("intro");const[dimIdx,setDimIdx]=useState(0);const[qIdx,setQIdx]=useState(0);const[answers,setAnswers]=useState({});const[vis,setVis]=useState(true);const dims=mapData.dims;const total=dims.reduce((a,d)=>a+d.questions.length,0);const answered=Object.keys(answers).length;const dim=dims[dimIdx];const key=dim?`${dim.id}-${qIdx}`:"";const go=(fn)=>{setVis(false);setTimeout(()=>{fn();setVis(true)},130)};const answer=(v)=>{setAnswers({...answers,[key]:v});setTimeout(()=>{if(qIdx<dim.questions.length-1)go(()=>setQIdx(qIdx+1));else if(dimIdx<dims.length-1)go(()=>{setDimIdx(dimIdx+1);setQIdx(0)});else go(()=>setPhase("results"))},220)};const back=()=>{if(qIdx>0)go(()=>setQIdx(qIdx-1));else if(dimIdx>0)go(()=>{setDimIdx(dimIdx-1);setQIdx(dims[dimIdx-1].questions.length-1)})};const scores=(()=>{const s={};dims.forEach(d=>{const vals=d.questions.map((_,qi)=>answers[`${d.id}-${qi}`]||0);s[d.id]=vals.reduce((a,b)=>a+b,0)/vals.length});return s})();const avg=Object.values(scores).reduce((a,b)=>a+b,0)/dims.length;const level=(sc)=>sc<=2.3?"low":sc<=3.7?"mid":"high";const accent=mapData.color;const restart=()=>go(()=>{setPhase("intro");setDimIdx(0);setQIdx(0);setAnswers({})});const card={maxWidth:460,width:"100%",margin:"0 auto",padding:"24px 20px",background:"#fffdf9",borderRadius:14,boxShadow:"0 3px 18px rgba(0,0,0,0.05)",opacity:vis?1:0,transition:"opacity 0.2s ease"};

if(phase==="intro")return(<div className="fade-up" style={{padding:"6px 0"}}><div style={card}><div style={{textAlign:"center"}}><div style={{display:"inline-block",padding:"3px 12px",borderRadius:14,background:`${accent}12`,color:accent,fontSize:10,fontWeight:700,letterSpacing:1.5,textTransform:"uppercase",marginBottom:10}}>{mapData.icon} {mapData.label}</div><h2 style={{fontSize:17,fontWeight:700,color:"#1a1a1a",lineHeight:1.35,margin:"0 0 3px"}}>Mapa de Autorreflexão</h2><p style={{fontSize:11,color:"#555",margin:"0 0 3px"}}>Terapias de RNA para Autismo</p><p style={{fontSize:13,color:"#555",fontStyle:"italic",margin:"0 0 12px"}}>{mapData.subtitle}</p><p style={{fontSize:13,lineHeight:1.65,color:"#444",margin:"0 0 14px"}}>{mapData.intro}</p><div style={{display:"flex",justifyContent:"center",gap:6,flexWrap:"wrap",marginBottom:14}}>{dims.map(d=>(<span key={d.id} style={{display:"inline-flex",alignItems:"center",gap:4,padding:"4px 10px",borderRadius:14,background:`${d.color}10`,fontSize:11,color:d.color,fontWeight:600,border:`1px solid ${d.color}18`}}>{d.icon} {d.label}</span>))}</div><p style={{fontSize:11,color:"#777",margin:"0 0 12px"}}>12 perguntas · ~3 min</p><button onClick={()=>go(()=>setPhase("quiz"))} style={{width:"100%",maxWidth:260,padding:"12px 0",background:accent,color:"#fff",border:"none",borderRadius:9,fontSize:14,fontWeight:700,boxShadow:`0 3px 10px ${accent}40`,transition:"filter 0.3s"}} onMouseOver={e=>e.target.style.filter="brightness(0.9)"} onMouseOut={e=>e.target.style.filter="none"}>Começar →</button></div></div></div>);

if(phase==="quiz"){const gi=dims.slice(0,dimIdx).reduce((a,d)=>a+d.questions.length,0)+qIdx+1;return(<div style={{padding:"6px 0"}}><div style={{maxWidth:460,margin:"0 auto 8px",height:3,background:"#d6d1cb",borderRadius:2}}><div style={{height:"100%",width:`${(answered/total)*100}%`,background:dim.color,transition:"width 0.4s",borderRadius:2}}/></div><div style={card}><div style={{display:"flex",alignItems:"center",gap:7,marginBottom:3}}><span style={{fontSize:20}}>{dim.icon}</span><span style={{fontSize:11,fontWeight:700,color:dim.color,letterSpacing:1,textTransform:"uppercase"}}>{dim.label}</span><span style={{fontSize:11,color:"#777",marginLeft:"auto"}}>{gi}/{total}</span></div><p style={{fontSize:11,color:"#666",fontStyle:"italic",margin:"0 0 16px"}}>{dim.tagline}</p><p style={{fontSize:14,lineHeight:1.7,color:"#222",fontWeight:500,margin:"0 0 20px"}}>{dim.questions[qIdx]}</p><div style={{display:"flex",justifyContent:"center",gap:7,marginBottom:6}}>{[1,2,3,4,5].map(v=><ScaleBtn key={v} value={v} selected={answers[key]} onClick={answer} color={dim.color}/>)}</div><div style={{display:"flex",justifyContent:"space-between",fontSize:10,color:"#777",maxWidth:230,margin:"0 auto"}}><span>Discordo</span><span>Concordo</span></div>{(dimIdx>0||qIdx>0)&&(<div style={{textAlign:"center",marginTop:14}}><button onClick={back} style={{background:"none",border:"none",color:"#777",fontSize:12}}>← Voltar</button></div>)}</div></div>)}

return(<div style={{padding:"6px 0",opacity:vis?1:0,transition:"opacity 0.5s"}}><div style={{maxWidth:460,margin:"0 auto"}}><div style={{textAlign:"center",padding:"22px 18px",background:"#fffdf9",borderRadius:14,boxShadow:"0 3px 18px rgba(0,0,0,0.05)",marginBottom:10}}><div style={{display:"inline-block",padding:"3px 10px",borderRadius:14,background:`${accent}12`,color:accent,fontSize:9,fontWeight:700,letterSpacing:1.5,textTransform:"uppercase",marginBottom:8}}>{mapData.icon} {mapData.label} — RESULTADO</div><h3 style={{fontSize:15,color:"#1a1a1a",margin:"0 0 3px"}}>{mapData.resultTitle}</h3><p style={{fontSize:11,color:"#666",fontStyle:"italic",margin:"0 0 12px"}}>{mapData.resultSubtitle}</p><RadarChart scores={scores} dims={dims} accent={accent}/><div style={{display:"flex",flexWrap:"wrap",gap:5,justifyContent:"center",marginTop:10}}>{dims.map(d=>(<span key={d.id} style={{display:"inline-flex",alignItems:"center",gap:3,padding:"3px 8px",borderRadius:10,background:`${d.color}10`,fontSize:11,color:d.color,fontWeight:600}}>{d.icon} {scores[d.id].toFixed(1)}</span>))}</div><div style={{marginTop:10,padding:"5px 12px",background:mapData.key==="antes"?"#f3eef8":"#fdeaea",borderRadius:7,display:"inline-block"}}><span style={{fontSize:11,color:"#555"}}>Média: </span><span style={{fontSize:15,fontWeight:700,color:accent}}>{avg.toFixed(1)}</span><span style={{fontSize:11,color:"#555"}}> / 5.0</span></div></div>
{dims.map(d=>{const sc=scores[d.id],bw=(sc/5)*100;return(<div key={d.id} style={{padding:"14px 16px 16px",background:"#fffdf9",borderRadius:11,boxShadow:"0 2px 10px rgba(0,0,0,0.04)",marginBottom:8,borderLeft:`3px solid ${d.color}`}}><div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:5}}><div style={{display:"flex",alignItems:"center",gap:5}}><span style={{fontSize:15}}>{d.icon}</span><span style={{fontSize:12,fontWeight:700,color:"#222"}}>{d.label}</span></div><span style={{fontSize:14,fontWeight:700,color:d.color}}>{sc.toFixed(1)}</span></div><div style={{height:3,background:"#ddd",borderRadius:2,marginBottom:8,overflow:"hidden"}}><div style={{height:"100%",width:`${bw}%`,background:`linear-gradient(90deg, ${d.color}88, ${d.color})`,borderRadius:2,transition:"width 0.8s"}}/></div><p style={{fontSize:12,lineHeight:1.65,color:"#444",margin:0}}>{d.feedback[level(sc)]}</p></div>)})}
<div style={{padding:"18px 18px",background:accent,borderRadius:11,textAlign:"center",marginBottom:8,boxShadow:`0 2px 10px ${accent}28`}}><p style={{fontSize:13,color:"#fff",lineHeight:1.65,margin:0,fontWeight:500}}>{mapData.cta}</p>{mapData.ctaButton&&<p style={{fontSize:15,color:"#fff",margin:"10px 0 0",fontWeight:700}}>{mapData.ctaButton}</p>}{mapData.key==="depois"&&(<p style={{fontSize:12,color:"#ffffffdd",lineHeight:1.65,margin:"10px 0 0",fontStyle:"italic"}}>Essa ponte, uma vez construída, não será desfeita.</p>)}</div>
<div style={{display:"flex",justifyContent:"center",gap:8,padding:"6px 0"}}><button onClick={restart} style={{background:"#fffdf9",border:"1.5px solid #bbb",borderRadius:7,padding:"8px 18px",fontSize:12,fontWeight:600,color:"#666",transition:"all 0.3s"}} onMouseOver={e=>{e.target.style.borderColor=accent;e.target.style.color=accent}} onMouseOut={e=>{e.target.style.borderColor="#bbb";e.target.style.color="#666"}}>↻ Refazer</button>{mapData.key==="antes"&&(<button onClick={()=>onSwitchTab("depois")} style={{background:MAPS.depois.color,border:"none",borderRadius:7,padding:"8px 18px",fontSize:12,fontWeight:700,color:"#fff",boxShadow:`0 2px 6px ${MAPS.depois.color}40`,transition:"filter 0.3s"}} onMouseOver={e=>e.target.style.filter="brightness(0.9)"} onMouseOut={e=>e.target.style.filter="none"}>{MAPS.depois.icon} Mapa Depois →</button>)}</div></div></div>)}

function App(){const[activeTab,setActiveTab]=useState("antes");const wrapRef=useAutoResize();return(<div ref={wrapRef} style={{background:"#f7f3ee",padding:"12px 10px 8px"}}><div style={{maxWidth:500,margin:"0 auto"}}><div style={{textAlign:"center",marginBottom:4}}><p style={{fontSize:10,color:"#666",letterSpacing:1.5,textTransform:"uppercase",margin:0}}>Psicologias em Dia · Sentir, Pensar e Transformar</p></div><div style={{display:"flex",gap:5,marginBottom:3,justifyContent:"center"}}>{["antes","depois"].map(t=>{const m=MAPS[t],active=activeTab===t;return(<button key={t} onClick={()=>setActiveTab(t)} style={{padding:"8px 16px",borderRadius:7,background:active?m.color:"#fffdf9",color:active?"#fff":"#777",border:active?"none":"1.5px solid #ccc",fontSize:11,fontWeight:700,boxShadow:active?`0 2px 8px ${m.color}28`:"none",transition:"all 0.25s ease"}}>{m.tab}</button>)})}</div><MapFlow key={activeTab} mapData={MAPS[activeTab]} onSwitchTab={setActiveTab}/><p style={{textAlign:"center",fontSize:10,color:"#666",marginTop:3,paddingBottom:6}}>© Psicologias em Dia · Ferramenta de autorreflexão — não substitui avaliação profissional.</p></div></div>)}
ReactDOM.render(<App/>,document.getElementById("root"));
</script>
