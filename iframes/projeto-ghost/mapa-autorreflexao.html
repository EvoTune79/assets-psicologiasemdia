function RadarChart({ scores, dimensions, accent }) {
  const size = 270, center = size / 2, maxR = center - 34, levels = 5;
  const step = (2 * Math.PI) / dimensions.length, start = -Math.PI / 2;
  const pt = (i, v) => {
    const a = start + i * step, r = (v / 5) * maxR;
    return { x: center + r * Math.cos(a), y: center + r * Math.sin(a) };
  };
  const grid = Array.from({ length: levels }, (_, i) => {
    const r = ((i + 1) / levels) * maxR;
    return dimensions.map((_, j) => {
      const a = start + j * step;
      return `${center + r * Math.cos(a)},${center + r * Math.sin(a)}`;
    }).join(" ");
  });
  const data = dimensions.map((d, i) => {
    const p = pt(i, scores[d.id] || 0); return `${p.x},${p.y}`;
  }).join(" ");
  const labels = dimensions.map((d, i) => {
    const a = start + i * step, r = maxR + 24;
    return { x: center + r * Math.cos(a), y: center + r * Math.sin(a), icon: d.icon };
  });
  return (
    <svg viewBox={`0 0 ${size} ${size}`} style={{ width: "100%", maxWidth: 270, margin: "0 auto", display: "block" }}>
      {grid.map((pts, i) => <polygon key={i} points={pts} fill="none" stroke={i === levels - 1 ? "#bbb" : "#e8e4df"} strokeWidth={i === levels - 1 ? 1 : 0.5} />)}
      {dimensions.map((_, i) => { const p = pt(i, 5); return <line key={i} x1={center} y1={center} x2={p.x} y2={p.y} stroke="#e0dbd4" strokeWidth={0.5} />; })}
      <polygon points={data} fill={`${accent}20`} stroke={accent} strokeWidth={2} />
      {dimensions.map((d, i) => { const p = pt(i, scores[d.id] || 0); return <circle key={i} cx={p.x} cy={p.y} r={4.5} fill={d.color} stroke="#fff" strokeWidth={1.8} />; })}
      {labels.map((lp, i) => <text key={i} x={lp.x} y={lp.y} textAnchor="middle" dominantBaseline="central" fontSize="16">{lp.icon}</text>)}
    </svg>
  );
}

function ScaleBtn({ value, selected, onClick, color }) {
  const on = selected === value;
  const [hov, setHov] = useState(false);
  return (
    <button onClick={() => onClick(value)} onMouseOver={() => setHov(true)} onMouseOut={() => setHov(false)}
      style={{
        width: 46, height: 46, borderRadius: "50%",
        border: on ? `2.5px solid ${color}` : `2px solid ${hov ? "#bbb" : "#d4d4d4"}`,
        background: on ? color : hov ? "#f0f0f0" : "#fafafa",
        color: on ? "#fff" : "#888", fontWeight: 700, fontSize: 15,
        transition: "all 0.2s ease",
        transform: on ? "scale(1.12)" : "scale(1)",
        boxShadow: on ? `0 2px 10px ${color}44` : "none", outline: "none",
      }}>
      {value}
    </button>
  );
}

/* ═══════════════════════════════════════════
   SINGLE MAP FLOW
   ═══════════════════════════════════════════ */

function MapFlow({ mapData, onFinish, onSwitchTab }) {
  const [phase, setPhase] = useState("intro");
  const [dimIdx, setDimIdx] = useState(0);
  const [qIdx, setQIdx] = useState(0);
  const [answers, setAnswers] = useState({});
  const [vis, setVis] = useState(true);

  const dims = mapData.dimensions;
  const total = dims.reduce((a, d) => a + d.questions.length, 0);
  const answered = Object.keys(answers).length;
  const dim = dims[dimIdx];
  const key = dim ? `${dim.id}-${qIdx}` : "";

  const go = (fn) => { setVis(false); setTimeout(() => { fn(); setVis(true); }, 170); };

  const answer = (v) => {
    setAnswers({ ...answers, [key]: v });
    setTimeout(() => {
      if (qIdx < dim.questions.length - 1) go(() => setQIdx(qIdx + 1));
      else if (dimIdx < dims.length - 1) go(() => { setDimIdx(dimIdx + 1); setQIdx(0); });
      else go(() => setPhase("results"));
    }, 260);
  };

  const back = () => {
    if (qIdx > 0) go(() => setQIdx(qIdx - 1));
    else if (dimIdx > 0) go(() => { setDimIdx(dimIdx - 1); setQIdx(dims[dimIdx - 1].questions.length - 1); });
  };

  const scores = (() => {
    const s = {};
    dims.forEach(d => {
      const vals = d.questions.map((_, qi) => answers[`${d.id}-${qi}`] || 0);
      s[d.id] = vals.reduce((a, b) => a + b, 0) / vals.length;
    });
    return s;
  })();

  const avg = Object.values(scores).reduce((a, b) => a + b, 0) / dims.length;
  const level = (sc) => sc <= 2.3 ? "low" : sc <= 3.7 ? "mid" : "high";
  const accent = mapData.color;

  const restart = () => go(() => { setPhase("intro"); setDimIdx(0); setQIdx(0); setAnswers({}); });

  const card = {
    maxWidth: 500, width: "100%", padding: "36px 26px", background: "#fffdf9",
    borderRadius: 18, boxShadow: "0 5px 28px rgba(0,0,0,0.06)",
    opacity: vis ? 1 : 0, transition: "opacity 0.25s ease",
  };

  /* ── INTRO ── */
  if (phase === "intro") return (
    <div className="fade-up" style={{ display: "flex", justifyContent: "center", padding: "16px 0" }}>
      <div style={card}>
        <div style={{ textAlign: "center" }}>
          <div style={{ display: "inline-block", padding: "5px 16px", borderRadius: 18, background: `${accent}12`, color: accent, fontSize: 10, fontWeight: 700, letterSpacing: 2, textTransform: "uppercase", marginBottom: 14 }}>
            {mapData.icon} {mapData.label}
          </div>
          <h2 style={{ fontSize: 19, fontWeight: 700, color: "#1a1a1a", lineHeight: 1.4, margin: "0 0 4px" }}>Mapa de Autorreflexão</h2>
          <p style={{ fontSize: 14, color: "#777", fontStyle: "italic", margin: "0 0 20px" }}>{mapData.subtitle}</p>
          <p style={{ fontSize: 13, lineHeight: 1.75, color: "#555", margin: "0 0 24px" }}>{mapData.intro}</p>
          <div style={{ display: "flex", flexDirection: "column", gap: 8, alignItems: "center", marginBottom: 24 }}>
            {dims.map(d => (
              <div key={d.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "7px 16px", borderRadius: 10, background: `${d.color}08`, border: `1px solid ${d.color}18`, width: "100%", maxWidth: 310 }}>
                <span style={{ fontSize: 20 }}>{d.icon}</span>
                <span style={{ fontSize: 12, fontWeight: 700, color: d.color }}>{d.label}</span>
                <span style={{ fontSize: 11, color: "#aaa", fontStyle: "italic", marginLeft: "auto" }}>{d.tagline}</span>
              </div>
            ))}
          </div>
          <p style={{ fontSize: 11, color: "#ccc", margin: "0 0 18px" }}>12 perguntas · ~3 minutos</p>
          <button onClick={() => go(() => setPhase("quiz"))} style={{
            width: "100%", maxWidth: 320, padding: "14px 0", background: accent, color: "#fff",
            border: "none", borderRadius: 11, fontSize: 14, fontWeight: 700,
            boxShadow: `0 3px 14px ${accent}40`, transition: "background 0.3s",
          }}
            onMouseOver={e => e.target.style.filter = "brightness(0.9)"}
            onMouseOut={e => e.target.style.filter = "none"}
          >Começar →</button>
        </div>
      </div>
    </div>
  );

  /* ── QUIZ ── */
  if (phase === "quiz") {
    const gi = dims.slice(0, dimIdx).reduce((a, d) => a + d.questions.length, 0) + qIdx + 1;
    return (
      <div style={{ display: "flex", flexDirection: "column", alignItems: "center", padding: "16px 0" }}>
        <div style={{ width: "100%", maxWidth: 500, height: 3, background: "#e0dbd4", borderRadius: 2, marginBottom: 16 }}>
          <div style={{ height: "100%", width: `${(answered / total) * 100}%`, background: dim.color, transition: "width 0.4s", borderRadius: 2 }} />
        </div>
        <div style={card}>
          <div style={{ display: "flex", alignItems: "center", gap: 9, marginBottom: 4 }}>
            <span style={{ fontSize: 24 }}>{dim.icon}</span>
            <span style={{ fontSize: 11, fontWeight: 700, color: dim.color, letterSpacing: 1, textTransform: "uppercase" }}>{dim.label}</span>
          </div>
          <p style={{ fontSize: 10, color: "#bbb", fontStyle: "italic", margin: "0 0 22px" }}>{dim.tagline}</p>
          <p style={{ fontSize: 10, color: "#ccc", fontWeight: 600, margin: "0 0 5px" }}>Pergunta {gi} de {total}</p>
          <p style={{ fontSize: 14.5, lineHeight: 1.75, color: "#222", fontWeight: 500, margin: "0 0 28px" }}>{dim.questions[qIdx]}</p>
          <div style={{ display: "flex", justifyContent: "center", gap: 9, marginBottom: 10 }}>
            {[1,2,3,4,5].map(v => <ScaleBtn key={v} value={v} selected={answers[key]} onClick={answer} color={dim.color} />)}
          </div>
          <div style={{ display: "flex", justifyContent: "space-between", fontSize: 9, color: "#aaa", maxWidth: 260, margin: "0 auto" }}>
            <span>Discordo</span><span>Concordo</span>
          </div>
          {(dimIdx > 0 || qIdx > 0) && (
            <div style={{ textAlign: "center", marginTop: 22 }}>
              <button onClick={back} style={{ background: "none", border: "none", color: "#aaa", fontSize: 12 }}>← Voltar</button>
            </div>
          )}
        </div>
      </div>
    );
  }

  /* ── RESULTS ── */
  return (
    <div style={{ padding: "16px 0", opacity: vis ? 1 : 0, transition: "opacity 0.5s" }}>
      <div style={{ maxWidth: 520, margin: "0 auto" }}>
        <div style={{ textAlign: "center", padding: "28px 22px", background: "#fffdf9", borderRadius: 18, boxShadow: "0 5px 28px rgba(0,0,0,0.06)", marginBottom: 14 }}>
          <div style={{ display: "inline-block", padding: "4px 14px", borderRadius: 18, background: `${accent}12`, color: accent, fontSize: 9, fontWeight: 700, letterSpacing: 2, textTransform: "uppercase", marginBottom: 12 }}>
            {mapData.icon} {mapData.label} — RESULTADO
          </div>
          <h3 style={{ fontSize: 17, color: "#1a1a1a", margin: "0 0 4px" }}>{mapData.resultTitle}</h3>
          <p style={{ fontSize: 11, color: "#888", fontStyle: "italic", margin: "0 0 18px" }}>{mapData.resultSubtitle}</p>
          <RadarChart scores={scores} dimensions={dims} accent={accent} />
          <div style={{ display: "flex", flexWrap: "wrap", gap: 7, justifyContent: "center", marginTop: 16 }}>
            {dims.map(d => (
              <span key={d.id} style={{ display: "inline-flex", alignItems: "center", gap: 4, padding: "4px 11px", borderRadius: 14, background: `${d.color}10`, fontSize: 11, color: d.color, fontWeight: 600 }}>
                {d.icon} {scores[d.id].toFixed(1)}
              </span>
            ))}
          </div>
          <div style={{ marginTop: 14, padding: "8px 16px", background: mapData.key === "antes" ? "#f0f7ff" : "#e8f8ef", borderRadius: 8, display: "inline-block" }}>
            <span style={{ fontSize: 10, color: "#666" }}>Média: </span>
            <span style={{ fontSize: 16, fontWeight: 700, color: accent }}>{avg.toFixed(1)}</span>
            <span style={{ fontSize: 10, color: "#666" }}> / 5.0</span>
          </div>
        </div>

        {dims.map(d => {
          const sc = scores[d.id], bw = (sc / 5) * 100;
          return (
            <div key={d.id} style={{ padding: "18px 20px 22px", background: "#fffdf9", borderRadius: 14, boxShadow: "0 3px 14px rgba(0,0,0,0.04)", marginBottom: 10, borderLeft: `3px solid ${d.color}` }}>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 7 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                  <span style={{ fontSize: 18 }}>{d.icon}</span>
                  <span style={{ fontSize: 12, fontWeight: 700, color: "#222" }}>{d.label}</span>
                </div>
                <span style={{ fontSize: 15, fontWeight: 700, color: d.color }}>{sc.toFixed(1)}</span>
              </div>
              <div style={{ height: 4, background: "#eee", borderRadius: 2, marginBottom: 12, overflow: "hidden" }}>
                <div style={{ height: "100%", width: `${bw}%`, background: `linear-gradient(90deg, ${d.color}88, ${d.color})`, borderRadius: 2, transition: "width 0.8s" }} />
              </div>
              <p style={{ fontSize: 12.5, lineHeight: 1.75, color: "#555", margin: 0 }}>{d.feedback[level(sc)]}</p>
            </div>
          );
        })}

        <div style={{ padding: "24px 22px", background: accent, borderRadius: 14, textAlign: "center", marginBottom: 10, boxShadow: `0 3px 16px ${accent}28` }}>
          <p style={{ fontSize: 13, color: "#fff", lineHeight: 1.75, margin: 0, fontWeight: 500 }}>{mapData.cta}</p>
          {mapData.ctaButton && (
            <p style={{ fontSize: 16, color: "#fff", margin: "14px 0 0", fontWeight: 700 }}>{mapData.ctaButton}</p>
          )}
          {mapData.key === "depois" && (
            <p style={{ fontSize: 12, color: "#ffffffcc", lineHeight: 1.7, margin: "14px 0 0" }}>
              <strong>Quer continuar essa jornada?</strong> Inscreva-se na newsletter do Psicologias em Dia.
            </p>
          )}
        </div>

        <div style={{ display: "flex", justifyContent: "center", gap: 12, padding: "10px 0" }}>
          <button onClick={restart} style={{ background: "#fffdf9", border: "1.5px solid #d4cfc8", borderRadius: 8, padding: "10px 22px", fontSize: 12, fontWeight: 600, color: "#999", transition: "all 0.3s" }}
            onMouseOver={e => { e.target.style.borderColor = accent; e.target.style.color = accent; }}
            onMouseOut={e => { e.target.style.borderColor = "#d4cfc8"; e.target.style.color = "#999"; }}
          >↻ Refazer</button>
          {mapData.key === "antes" && (
            <button onClick={() => onSwitchTab("depois")} style={{ background: MAPS.depois.color, border: "none", borderRadius: 8, padding: "10px 22px", fontSize: 12, fontWeight: 700, color: "#fff", boxShadow: `0 2px 10px ${MAPS.depois.color}40`, transition: "all 0.3s" }}
              onMouseOver={e => e.target.style.filter = "brightness(0.9)"}
              onMouseOut={e => e.target.style.filter = "none"}
            >{MAPS.depois.icon} Ir para o mapa Depois →</button>
          )}
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════
   MAIN APP — TABBED
   ═══════════════════════════════════════════ */

function App() {
  const [activeTab, setActiveTab] = useState("antes");
  const [keys, setKeys] = useState({ antes: 0, depois: 0 });

  const switchTab = (tab) => setActiveTab(tab);

  // force re-mount on refazer
  const mapData = MAPS[activeTab];

  return (
    <div style={{ minHeight: "100vh", background: "linear-gradient(160deg, #f7f3ee 0%, #eee8e0 40%, #e8e2db 100%)", padding: "20px 16px" }}>
      <div style={{ maxWidth: 540, margin: "0 auto" }}>
        {/* Header */}
        <div style={{ textAlign: "center", marginBottom: 6 }}>
          <p style={{ fontSize: 10, color: "#bbb", letterSpacing: 2, textTransform: "uppercase", margin: "0 0 2px" }}>Psicologias em Dia</p>
          <p style={{ fontSize: 9, color: "#ccc", fontStyle: "italic" }}>Sentir, Pensar e Transformar</p>
        </div>

        {/* Tabs */}
        <div style={{ display: "flex", gap: 6, marginBottom: 8, justifyContent: "center" }}>
          {["antes", "depois"].map(t => {
            const m = MAPS[t], active = activeTab === t;
            return (
              <button key={t} onClick={() => switchTab(t)} style={{
                padding: "10px 20px", borderRadius: 10,
                background: active ? m.color : "#fffdf9",
                color: active ? "#fff" : "#999",
                border: active ? "none" : "1.5px solid #e0dbd4",
                fontSize: 12, fontWeight: 700,
                boxShadow: active ? `0 2px 12px ${m.color}30` : "none",
                transition: "all 0.3s ease",
              }}>
                {m.tab}
              </button>
            );
          })}
        </div>

        {/* Active Map */}
        <MapFlow
          key={activeTab}
          mapData={mapData}
          onSwitchTab={switchTab}
        />

        {/* Footer */}
        <p style={{ textAlign: "center", fontSize: 9, color: "#ccc", marginTop: 8, paddingBottom: 20 }}>
          © Psicologias em Dia · Ferramenta de autorreflexão — não substitui avaliação profissional.
        </p>
      </div>
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById("root"));
</script>
</body>
</html>
