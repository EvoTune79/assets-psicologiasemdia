function useAutoResize() {
  const ref = useRef(null);
  const notify = useCallback(() => {
    if (!ref.current) return;
    const h = ref.current.scrollHeight + 20;
    window.parent.postMessage({ type: "resize", height: h }, "*");
    try { if (window.frameElement) window.frameElement.style.height = h + "px"; } catch(e) {}
  }, []);
  useEffect(() => {
    notify();
    const obs = new MutationObserver(notify);
    if (ref.current) obs.observe(ref.current, { childList: true, subtree: true, attributes: true });
    window.addEventListener("resize", notify);
    return () => { obs.disconnect(); window.removeEventListener("resize", notify); };
  }, [notify]);
  return ref;
}

/* ═══════ COMPONENTS ═══════ */

function RadarChart({ scores, dimensions, accent }) {
  const size = 260, center = size / 2, maxR = center - 32, levels = 5;
  const step = (2 * Math.PI) / dimensions.length, start = -Math.PI / 2;
  const pt = (i, v) => {
    const a = start + i * step, r = (v / 5) * maxR;
    return { x: center + r * Math.cos(a), y: center + r * Math.sin(a) };
  };
  const grid = Array.from({ length: levels }, (_, i) => {
    const r = ((i + 1) / levels) * maxR;
    return dimensions.map((_, j) => {
      const a = start + j * step;
      return `${center + r * Math.cos(a)},${center + r * Math.sin(a)}`;
    }).join(" ");
  });
  const data = dimensions.map((d, i) => {
    const p = pt(i, scores[d.id] || 0); return `${p.x},${p.y}`;
  }).join(" ");
  const labels = dimensions.map((d, i) => {
    const a = start + i * step, r = maxR + 22;
    return { x: center + r * Math.cos(a), y: center + r * Math.sin(a), icon: d.icon };
  });
  return (
    <svg viewBox={`0 0 ${size} ${size}`} style={{ width: "100%", maxWidth: 260, margin: "0 auto", display: "block" }}>
      {grid.map((pts, i) => <polygon key={i} points={pts} fill="none" stroke={i === levels - 1 ? "#bbb" : "#e8e4df"} strokeWidth={i === levels - 1 ? 1 : 0.5} />)}
      {dimensions.map((_, i) => { const p = pt(i, 5); return <line key={i} x1={center} y1={center} x2={p.x} y2={p.y} stroke="#e0dbd4" strokeWidth={0.5} />; })}
      <polygon points={data} fill={`${accent}20`} stroke={accent} strokeWidth={2} />
      {dimensions.map((d, i) => { const p = pt(i, scores[d.id] || 0); return <circle key={i} cx={p.x} cy={p.y} r={4.5} fill={d.color} stroke="#fff" strokeWidth={1.8} />; })}
      {labels.map((lp, i) => <text key={i} x={lp.x} y={lp.y} textAnchor="middle" dominantBaseline="central" fontSize="15">{lp.icon}</text>)}
    </svg>
  );
}

function ScaleBtn({ value, selected, onClick, color }) {
  const on = selected === value;
  const [hov, setHov] = useState(false);
  return (
    <button onClick={() => onClick(value)} onMouseOver={() => setHov(true)} onMouseOut={() => setHov(false)}
      style={{
        width: 44, height: 44, borderRadius: "50%",
        border: on ? `2.5px solid ${color}` : `2px solid ${hov ? "#bbb" : "#d4d4d4"}`,
        background: on ? color : hov ? "#f0f0f0" : "#fafafa",
        color: on ? "#fff" : "#888", fontWeight: 700, fontSize: 15,
        transition: "all 0.2s ease",
        transform: on ? "scale(1.12)" : "scale(1)",
        boxShadow: on ? `0 2px 10px ${color}44` : "none", outline: "none",
      }}>
      {value}
    </button>
  );
}

function MapFlow({ mapData, onSwitchTab }) {

  const [qIdx, setQIdx] = useState(0);
  const [answers, setAnswers] = useState({});
  const [vis, setVis] = useState(true);

  const dims = mapData.dimensions;
  const total = dims.reduce((a, d) => a + d.questions.length, 0);
  const answered = Object.keys(answers).length;
  const dim = dims[dimIdx];
  const key = dim ? `${dim.id}-${qIdx}` : "";

  const go = (fn) => { setVis(false); setTimeout(() => { fn(); setVis(true); }, 150); };

  const answer = (v) => {
    setAnswers({ ...answers, [key]: v });
    setTimeout(() => {
      if (qIdx < dim.questions.length - 1) go(() => setQIdx(qIdx + 1));
      else if (dimIdx < dims.length - 1) go(() => { setDimIdx(dimIdx + 1); setQIdx(0); });
      else go(() => setPhase("results"));
    }, 250);
  };

  const back = () => {
    if (qIdx > 0) go(() => setQIdx(qIdx - 1));
    else if (dimIdx > 0) go(() => { setDimIdx(dimIdx - 1); setQIdx(dims[dimIdx - 1].questions.length - 1); });
  };

  const scores = (() => {
    const s = {};
    dims.forEach(d => {
      const vals = d.questions.map((_, qi) => answers[`${d.id}-${qi}`] || 0);
      s[d.id] = vals.reduce((a, b) => a + b, 0) / vals.length;
    });
    return s;
  })();

  const avg = Object.values(scores).reduce((a, b) => a + b, 0) / dims.length;
  const level = (sc) => sc <= 2.3 ? "low" : sc <= 3.7 ? "mid" : "high";
  const accent = mapData.color;

  const restart = () => go(() => { setPhase("intro"); setDimIdx(0); setQIdx(0); setAnswers({}); });

  const card = {
    maxWidth: 480, width: "100%", margin: "0 auto",
    padding: "32px 24px", background: "#fffdf9",
    borderRadius: 16, boxShadow: "0 4px 24px rgba(0,0,0,0.06)",
    opacity: vis ? 1 : 0, transition: "opacity 0.2s ease",
  };

  if (phase === "intro") return (
    <div className="fade-up" style={{ padding: "8px 0" }}>
      <div style={card}>
        <div style={{ textAlign: "center" }}>
          <div style={{ display: "inline-block", padding: "4px 14px", borderRadius: 16, background: `${accent}12`, color: accent, fontSize: 10, fontWeight: 700, letterSpacing: 1.5, textTransform: "uppercase", marginBottom: 12 }}>
            {mapData.icon} {mapData.label}
          </div>
          <h2 style={{ fontSize: 18, fontWeight: 700, color: "#1a1a1a", lineHeight: 1.4, margin: "0 0 4px" }}>Mapa de Autorreflexão</h2>
          <p style={{ fontSize: 11, color: "#999", margin: "0 0 4px" }}>Terapias de RNA para Autismo</p>

          <p style={{ fontSize: 13, lineHeight: 1.7, color: "#555", margin: "0 0 20px" }}>{mapData.intro}</p>
          <div style={{ display: "flex", flexDirection: "column", gap: 7, alignItems: "center", marginBottom: 20 }}>
            {dims.map(d => (
              <div key={d.id} style={{ display: "flex", alignItems: "center", gap: 8, padding: "6px 14px", borderRadius: 8, background: `${d.color}08`, border: `1px solid ${d.color}15`, width: "100%", maxWidth: 300 }}>
                <span style={{ fontSize: 18 }}>{d.icon}</span>
                <span style={{ fontSize: 12, fontWeight: 700, color: d.color }}>{d.label}</span>
                <span style={{ fontSize: 11, color: "#aaa", fontStyle: "italic", marginLeft: "auto" }}>{d.tagline}</span>
              </div>
            ))}
          </div>
          <p style={{ fontSize: 11, color: "#ccc", margin: "0 0 16px" }}>12 perguntas · ~3 minutos</p>

            onMouseOut={e => e.target.style.filter = "none"}

        </div>
      </div>
    </div>
  );

    const gi = dims.slice(0, dimIdx).reduce((a, d) => a + d.questions.length, 0) + qIdx + 1;
    return (
      <div style={{ padding: "8px 0" }}>
        <div style={{ maxWidth: 480, margin: "0 auto 12px", height: 3, background: "#e0dbd4", borderRadius: 2 }}>
          <div style={{ height: "100%", width: `${(answered / total) * 100}%`, background: dim.color, transition: "width 0.4s", borderRadius: 2 }} />
        </div>
        <div style={card}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 4 }}>
            <span style={{ fontSize: 22 }}>{dim.icon}</span>
            <span style={{ fontSize: 11, fontWeight: 700, color: dim.color, letterSpacing: 1, textTransform: "uppercase" }}>{dim.label}</span>
          </div>
          <p style={{ fontSize: 10, color: "#bbb", fontStyle: "italic", margin: "0 0 20px" }}>{dim.tagline}</p>
          <p style={{ fontSize: 10, color: "#ccc", fontWeight: 600, margin: "0 0 4px" }}>Pergunta {gi} de {total}</p>
          <p style={{ fontSize: 14, lineHeight: 1.75, color: "#222", fontWeight: 500, margin: "0 0 24px" }}>{dim.questions[qIdx]}</p>

      </div>
    );
  }

  return (
    <div style={{ padding: "8px 0", opacity: vis ? 1 : 0, transition: "opacity 0.5s" }}>
      <div style={{ maxWidth: 480, margin: "0 auto" }}>
        <div style={{ textAlign: "center", padding: "28px 20px", background: "#fffdf9", borderRadius: 16, boxShadow: "0 4px 24px rgba(0,0,0,0.06)", marginBottom: 12 }}>
          <div style={{ display: "inline-block", padding: "4px 12px", borderRadius: 16, background: `${accent}12`, color: accent, fontSize: 9, fontWeight: 700, letterSpacing: 1.5, textTransform: "uppercase", marginBottom: 10 }}>
            {mapData.icon} {mapData.label} — RESULTADO
          </div>
          <h3 style={{ fontSize: 16, color: "#1a1a1a", margin: "0 0 4px" }}>{mapData.resultTitle}</h3>
          <p style={{ fontSize: 11, color: "#888", fontStyle: "italic", margin: "0 0 16px" }}>{mapData.resultSubtitle}</p>
          <RadarChart scores={scores} dimensions={dims} accent={accent} />
          <div style={{ display: "flex", flexWrap: "wrap", gap: 6, justifyContent: "center", marginTop: 14 }}>
            {dims.map(d => (
              <span key={d.id} style={{ display: "inline-flex", alignItems: "center", gap: 4, padding: "4px 10px", borderRadius: 12, background: `${d.color}10`, fontSize: 11, color: d.color, fontWeight: 600 }}>
                {d.icon} {scores[d.id].toFixed(1)}
              </span>
            ))}
          </div>
          <div style={{ marginTop: 12, padding: "7px 14px", background: mapData.key === "antes" ? "#f3eef8" : "#fdeaea", borderRadius: 8, display: "inline-block" }}>
            <span style={{ fontSize: 10, color: "#666" }}>Média: </span>
            <span style={{ fontSize: 15, fontWeight: 700, color: accent }}>{avg.toFixed(1)}</span>
            <span style={{ fontSize: 10, color: "#666" }}> / 5.0</span>
          </div>
        </div>

        {dims.map(d => {
          const sc = scores[d.id], bw = (sc / 5) * 100;
          return (
            <div key={d.id} style={{ padding: "16px 18px 20px", background: "#fffdf9", borderRadius: 12, boxShadow: "0 2px 12px rgba(0,0,0,0.04)", marginBottom: 10, borderLeft: `3px solid ${d.color}` }}>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 6 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                  <span style={{ fontSize: 17 }}>{d.icon}</span>
                  <span style={{ fontSize: 12, fontWeight: 700, color: "#222" }}>{d.label}</span>
                </div>
                <span style={{ fontSize: 14, fontWeight: 700, color: d.color }}>{sc.toFixed(1)}</span>
              </div>
              <div style={{ height: 4, background: "#eee", borderRadius: 2, marginBottom: 10, overflow: "hidden" }}>
                <div style={{ height: "100%", width: `${bw}%`, background: `linear-gradient(90deg, ${d.color}88, ${d.color})`, borderRadius: 2, transition: "width 0.8s" }} />
              </div>
              <p style={{ fontSize: 12, lineHeight: 1.7, color: "#555", margin: 0 }}>{d.feedback[level(sc)]}</p>
            </div>
          );
        })}

        <div style={{ padding: "22px 20px", background: accent, borderRadius: 12, textAlign: "center", marginBottom: 10, boxShadow: `0 3px 14px ${accent}28` }}>
          <p style={{ fontSize: 13, color: "#fff", lineHeight: 1.7, margin: 0, fontWeight: 500 }}>{mapData.cta}</p>
          {mapData.ctaButton && <p style={{ fontSize: 15, color: "#fff", margin: "12px 0 0", fontWeight: 700 }}>{mapData.ctaButton}</p>}
          {mapData.key === "depois" && (
            <p style={{ fontSize: 11, color: "#ffffffcc", lineHeight: 1.7, margin: "12px 0 0" }}>
              <strong>Quer acompanhar mais conte\u00fados como este?</strong> Inscreva-se na newsletter do Psicologias em Dia.
            </p>
          )}
        </div>

        <div style={{ display: "flex", justifyContent: "center", gap: 10, padding: "8px 0" }}>
          <button onClick={restart} style={{ background: "#fffdf9", border: "1.5px solid #d4cfc8", borderRadius: 8, padding: "9px 20px", fontSize: 12, fontWeight: 600, color: "#999", transition: "all 0.3s" }}
            onMouseOver={e => { e.target.style.borderColor = accent; e.target.style.color = accent; }}
            onMouseOut={e => { e.target.style.borderColor = "#d4cfc8"; e.target.style.color = "#999"; }}
          >↻ Refazer</button>
          {mapData.key === "antes" && (
            <button onClick={() => onSwitchTab("depois")} style={{ background: MAPS.depois.color, border: "none", borderRadius: 8, padding: "9px 20px", fontSize: 12, fontWeight: 700, color: "#fff", boxShadow: `0 2px 8px ${MAPS.depois.color}40`, transition: "filter 0.3s" }}
              onMouseOver={e => e.target.style.filter = "brightness(0.9)"}
              onMouseOut={e => e.target.style.filter = "none"}
            >{MAPS.depois.icon} Mapa Depois →</button>
          )}
        </div>
      </div>
    </div>
  );
}

/* ═══════ MAIN ═══════ */

function App() {
  const [activeTab, setActiveTab] = useState("antes");
  const wrapRef = useAutoResize();

  return (
    <div ref={wrapRef} style={{ background: "#f7f3ee", padding: "16px 12px 12px" }}>
      <div style={{ maxWidth: 520, margin: "0 auto" }}>
        <div style={{ textAlign: "center", marginBottom: 6 }}>
          <p style={{ fontSize: 9, color: "#bbb", letterSpacing: 1.5, textTransform: "uppercase", margin: 0 }}>Psicologias em Dia · Sentir, Pensar e Transformar</p>
        </div>
        <div style={{ display: "flex", gap: 6, marginBottom: 4, justifyContent: "center" }}>
          {["antes", "depois"].map(t => {
            const m = MAPS[t], active = activeTab === t;
            return (
              <button key={t} onClick={() => setActiveTab(t)} style={{
                padding: "9px 18px", borderRadius: 8,
                background: active ? m.color : "#fffdf9",
                color: active ? "#fff" : "#aaa",
                border: active ? "none" : "1.5px solid #e0dbd4",
                fontSize: 11, fontWeight: 700,
                boxShadow: active ? `0 2px 10px ${m.color}28` : "none",
                transition: "all 0.25s ease",
              }}>
                {m.tab}
              </button>
            );
          })}
        </div>
        <MapFlow key={activeTab} mapData={MAPS[activeTab]} onSwitchTab={setActiveTab} />
        <p style={{ textAlign: "center", fontSize: 9, color: "#ccc", marginTop: 4, paddingBottom: 8 }}>
          © Psicologias em Dia · Ferramenta de autorreflexão — não substitui avaliação profissional.
        </p>
      </div>
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById("root"));
</script>
</body>
</html>
