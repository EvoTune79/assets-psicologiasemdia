function useAutoResize() {
  const ref = useRef(null);
  const notify = useCallback(() => {
    if (!ref.current) return;
    const h = ref.current.scrollHeight + 16;
    window.parent.postMessage({ type: "resize", height: h }, "*");
    try { if (window.frameElement) window.frameElement.style.height = h + "px"; } catch(e) {}
  }, []);
  useEffect(() => {
    notify();
    const obs = new MutationObserver(notify);
    if (ref.current) obs.observe(ref.current, { childList: true, subtree: true, attributes: true });
    window.addEventListener("resize", notify);
    return () => { obs.disconnect(); window.removeEventListener("resize", notify); };
  }, [notify]);
  return ref;
}

/* ═══════ COMPONENTS ═══════ */

function RadarChart({ scores, dims, accent }) {
  const size = 230, center = size / 2, maxR = center - 28, levels = 5;
  const step = (2 * Math.PI) / dims.length, start = -Math.PI / 2;
  const pt = (i, v) => {
    const a = start + i * step, r = (v / 5) * maxR;
    return { x: center + r * Math.cos(a), y: center + r * Math.sin(a) };
  };
  const grid = Array.from({ length: levels }, (_, i) => {
    const r = ((i + 1) / levels) * maxR;
    return dims.map((_, j) => {
      const a = start + j * step;
      return `${center + r * Math.cos(a)},${center + r * Math.sin(a)}`;
    }).join(" ");
  });
  const data = dims.map((d, i) => { const p = pt(i, scores[d.id] || 0); return `${p.x},${p.y}`; }).join(" ");
  const labels = dims.map((d, i) => {
    const a = start + i * step, r = maxR + 20;
    return { x: center + r * Math.cos(a), y: center + r * Math.sin(a), icon: d.icon };
  });
  return (
    <svg viewBox={`0 0 ${size} ${size}`} style={{ width: "100%", maxWidth: 230, margin: "0 auto", display: "block" }}>
      {grid.map((pts, i) => <polygon key={i} points={pts} fill="none" stroke={i === levels - 1 ? "#aaa" : "#d6d1cb"} strokeWidth={i === levels - 1 ? 1 : 0.5} />)}
      {dims.map((_, i) => { const p = pt(i, 5); return <line key={i} x1={center} y1={center} x2={p.x} y2={p.y} stroke="#d6d1cb" strokeWidth={0.5} />; })}
      <polygon points={data} fill={`${accent}20`} stroke={accent} strokeWidth={2} />
      {dims.map((d, i) => { const p = pt(i, scores[d.id] || 0); return <circle key={i} cx={p.x} cy={p.y} r={4} fill={d.color} stroke="#fff" strokeWidth={1.5} />; })}
      {labels.map((lp, i) => <text key={i} x={lp.x} y={lp.y} textAnchor="middle" dominantBaseline="central" fontSize="14">{lp.icon}</text>)}
    </svg>
  );
}

function ScaleBtn({ value, selected, onClick, color }) {
  const on = selected === value;
  const [hov, setHov] = useState(false);
  return (
    <button onClick={() => onClick(value)} onMouseOver={() => setHov(true)} onMouseOut={() => setHov(false)}
      style={{
        width: 42, height: 42, borderRadius: "50%",
        border: on ? `2.5px solid ${color}` : `2px solid ${hov ? "#999" : "#bbb"}`,
        background: on ? color : hov ? "#f0f0f0" : "#fafafa",
        color: on ? "#fff" : "#666", fontWeight: 700, fontSize: 14,
        transition: "all 0.2s ease",
        transform: on ? "scale(1.1)" : "scale(1)",
        boxShadow: on ? `0 2px 8px ${color}44` : "none", outline: "none",
      }}>
      {value}
    </button>
  );
}

/* ═══════ MAP FLOW ═══════ */

function MapFlow({ mapData, onSwitchTab }) {
  const [phase, setPhase] = useState("intro");
  const [dimIdx, setDimIdx] = useState(0);
  const [qIdx, setQIdx] = useState(0);
  const [answers, setAnswers] = useState({});
  const [vis, setVis] = useState(true);

  const dims = mapData.dims;
  const total = dims.reduce((a, d) => a + d.questions.length, 0);
  const answered = Object.keys(answers).length;
  const dim = dims[dimIdx];
  const key = dim ? `${dim.id}-${qIdx}` : "";

  const go = (fn) => { setVis(false); setTimeout(() => { fn(); setVis(true); }, 130); };

  const answer = (v) => {
    setAnswers({ ...answers, [key]: v });
    setTimeout(() => {
      if (qIdx < dim.questions.length - 1) go(() => setQIdx(qIdx + 1));
      else if (dimIdx < dims.length - 1) go(() => { setDimIdx(dimIdx + 1); setQIdx(0); });
      else go(() => setPhase("results"));
    }, 220);
  };

  const back = () => {
    if (qIdx > 0) go(() => setQIdx(qIdx - 1));
    else if (dimIdx > 0) go(() => { setDimIdx(dimIdx - 1); setQIdx(dims[dimIdx - 1].questions.length - 1); });
  };

  const scores = (() => {
    const s = {};
    dims.forEach(d => {
      const vals = d.questions.map((_, qi) => answers[`${d.id}-${qi}`] || 0);
      s[d.id] = vals.reduce((a, b) => a + b, 0) / vals.length;
    });
    return s;
  })();

  const avg = Object.values(scores).reduce((a, b) => a + b, 0) / dims.length;
  const level = (sc) => sc <= 2.3 ? "low" : sc <= 3.7 ? "mid" : "high";
  const accent = mapData.color;

  const restart = () => go(() => { setPhase("intro"); setDimIdx(0); setQIdx(0); setAnswers({}); });

  const card = {
    maxWidth: 460, width: "100%", margin: "0 auto",
    padding: "24px 20px", background: "#fffdf9",
    borderRadius: 14, boxShadow: "0 3px 18px rgba(0,0,0,0.05)",
    opacity: vis ? 1 : 0, transition: "opacity 0.2s ease",
  };

  if (phase === "intro") return (
    <div className="fade-up" style={{ padding: "6px 0" }}>
      <div style={card}>
        <div style={{ textAlign: "center" }}>
          <div style={{ display: "inline-block", padding: "3px 12px", borderRadius: 14, background: `${accent}12`, color: accent, fontSize: 10, fontWeight: 700, letterSpacing: 1.5, textTransform: "uppercase", marginBottom: 10 }}>
            {mapData.icon} {mapData.label}
          </div>
          <h2 style={{ fontSize: 17, fontWeight: 700, color: "#1a1a1a", lineHeight: 1.35, margin: "0 0 3px" }}>Mapa de Autorreflexão</h2>
          <p style={{ fontSize: 11, color: "#555", margin: "0 0 3px" }}>Reinvenção Profissional</p>
          <p style={{ fontSize: 13, color: "#555", fontStyle: "italic", margin: "0 0 12px" }}>{mapData.subtitle}</p>
          <p style={{ fontSize: 13, lineHeight: 1.65, color: "#444", margin: "0 0 14px" }}>{mapData.intro}</p>
          <div style={{ display: "flex", justifyContent: "center", gap: 6, flexWrap: "wrap", marginBottom: 14 }}>
            {dims.map(d => (
              <span key={d.id} style={{ display: "inline-flex", alignItems: "center", gap: 4, padding: "4px 10px", borderRadius: 14, background: `${d.color}10`, fontSize: 11, color: d.color, fontWeight: 600, border: `1px solid ${d.color}18` }}>
                {d.icon} {d.label}
              </span>
            ))}
          </div>
          <p style={{ fontSize: 11, color: "#777", margin: "0 0 12px" }}>12 perguntas · ~3 min</p>
          <button onClick={() => go(() => setPhase("quiz"))} style={{
            width: "100%", maxWidth: 260, padding: "12px 0", background: accent, color: "#fff",
            border: "none", borderRadius: 9, fontSize: 14, fontWeight: 700,
            boxShadow: `0 3px 10px ${accent}40`, transition: "filter 0.3s",
          }}
            onMouseOver={e => e.target.style.filter = "brightness(0.9)"}
            onMouseOut={e => e.target.style.filter = "none"}
          >Começar →</button>
        </div>
      </div>
    </div>
  );

  if (phase === "quiz") {
    const gi = dims.slice(0, dimIdx).reduce((a, d) => a + d.questions.length, 0) + qIdx + 1;
    return (
      <div style={{ padding: "6px 0" }}>
        <div style={{ maxWidth: 460, margin: "0 auto 8px", height: 3, background: "#d6d1cb", borderRadius: 2 }}>
          <div style={{ height: "100%", width: `${(answered / total) * 100}%`, background: dim.color, transition: "width 0.4s", borderRadius: 2 }} />
        </div>
        <div style={card}>
          <div style={{ display: "flex", alignItems: "center", gap: 7, marginBottom: 3 }}>
            <span style={{ fontSize: 20 }}>{dim.icon}</span>
            <span style={{ fontSize: 11, fontWeight: 700, color: dim.color, letterSpacing: 1, textTransform: "uppercase" }}>{dim.label}</span>
            <span style={{ fontSize: 11, color: "#777", marginLeft: "auto" }}>{gi}/{total}</span>
          </div>
          <p style={{ fontSize: 11, color: "#666", fontStyle: "italic", margin: "0 0 16px" }}>{dim.tagline}</p>
          <p style={{ fontSize: 14, lineHeight: 1.7, color: "#222", fontWeight: 500, margin: "0 0 20px" }}>{dim.questions[qIdx]}</p>
          <div style={{ display: "flex", justifyContent: "center", gap: 7, marginBottom: 6 }}>
            {[1,2,3,4,5].map(v => <ScaleBtn key={v} value={v} selected={answers[key]} onClick={answer} color={dim.color} />)}
          </div>
          <div style={{ display: "flex", justifyContent: "space-between", fontSize: 10, color: "#777", maxWidth: 230, margin: "0 auto" }}>
            <span>Discordo</span><span>Concordo</span>
          </div>
          {(dimIdx > 0 || qIdx > 0) && (
            <div style={{ textAlign: "center", marginTop: 14 }}>
              <button onClick={back} style={{ background: "none", border: "none", color: "#777", fontSize: 12 }}>← Voltar</button>
            </div>
          )}
        </div>
      </div>
    );
  }

  return (
    <div style={{ padding: "6px 0", opacity: vis ? 1 : 0, transition: "opacity 0.5s" }}>
      <div style={{ maxWidth: 460, margin: "0 auto" }}>
        <div style={{ textAlign: "center", padding: "22px 18px", background: "#fffdf9", borderRadius: 14, boxShadow: "0 3px 18px rgba(0,0,0,0.05)", marginBottom: 10 }}>
          <div style={{ display: "inline-block", padding: "3px 10px", borderRadius: 14, background: `${accent}12`, color: accent, fontSize: 9, fontWeight: 700, letterSpacing: 1.5, textTransform: "uppercase", marginBottom: 8 }}>
            {mapData.icon} {mapData.label} — RESULTADO
          </div>
          <h3 style={{ fontSize: 15, color: "#1a1a1a", margin: "0 0 3px" }}>{mapData.resultTitle}</h3>
          <p style={{ fontSize: 11, color: "#666", fontStyle: "italic", margin: "0 0 12px" }}>{mapData.resultSubtitle}</p>
          <RadarChart scores={scores} dims={dims} accent={accent} />
          <div style={{ display: "flex", flexWrap: "wrap", gap: 5, justifyContent: "center", marginTop: 10 }}>
            {dims.map(d => (
              <span key={d.id} style={{ display: "inline-flex", alignItems: "center", gap: 3, padding: "3px 8px", borderRadius: 10, background: `${d.color}10`, fontSize: 11, color: d.color, fontWeight: 600 }}>
                {d.icon} {scores[d.id].toFixed(1)}
              </span>
            ))}
          </div>
          <div style={{ marginTop: 10, padding: "5px 12px", background: mapData.key === "antes" ? "#eef3fa" : "#e8f5ee", borderRadius: 7, display: "inline-block" }}>
            <span style={{ fontSize: 11, color: "#555" }}>Média: </span>
            <span style={{ fontSize: 15, fontWeight: 700, color: accent }}>{avg.toFixed(1)}</span>
            <span style={{ fontSize: 11, color: "#555" }}> / 5.0</span>
          </div>
        </div>

        {dims.map(d => {
          const sc = scores[d.id], bw = (sc / 5) * 100;
          return (
            <div key={d.id} style={{ padding: "14px 16px 16px", background: "#fffdf9", borderRadius: 11, boxShadow: "0 2px 10px rgba(0,0,0,0.04)", marginBottom: 8, borderLeft: `3px solid ${d.color}` }}>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 5 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 5 }}>
                  <span style={{ fontSize: 15 }}>{d.icon}</span>
                  <span style={{ fontSize: 12, fontWeight: 700, color: "#222" }}>{d.label}</span>
                </div>
                <span style={{ fontSize: 14, fontWeight: 700, color: d.color }}>{sc.toFixed(1)}</span>
              </div>
              <div style={{ height: 3, background: "#ddd", borderRadius: 2, marginBottom: 8, overflow: "hidden" }}>
                <div style={{ height: "100%", width: `${bw}%`, background: `linear-gradient(90deg, ${d.color}88, ${d.color})`, borderRadius: 2, transition: "width 0.8s" }} />
              </div>
              <p style={{ fontSize: 12, lineHeight: 1.65, color: "#444", margin: 0 }}>{d.feedback[level(sc)]}</p>
            </div>
          );
        })}

        <div style={{ padding: "18px 18px", background: accent, borderRadius: 11, textAlign: "center", marginBottom: 8, boxShadow: `0 2px 10px ${accent}28` }}>
          <p style={{ fontSize: 13, color: "#fff", lineHeight: 1.65, margin: 0, fontWeight: 500 }}>{mapData.cta}</p>
          {mapData.ctaButton && <p style={{ fontSize: 15, color: "#fff", margin: "10px 0 0", fontWeight: 700 }}>{mapData.ctaButton}</p>}
          {mapData.key === "depois" && (
            <p style={{ fontSize: 12, color: "#ffffffdd", lineHeight: 1.65, margin: "10px 0 0", fontStyle: "italic" }}>
              O primeiro passo s\u00f3lido na dire\u00e7\u00e3o certa come\u00e7a com uma pergunta honesta.
            </p>
          )}
        </div>

        <div style={{ display: "flex", justifyContent: "center", gap: 8, padding: "6px 0" }}>
          <button onClick={restart} style={{ background: "#fffdf9", border: "1.5px solid #bbb", borderRadius: 7, padding: "8px 18px", fontSize: 12, fontWeight: 600, color: "#666", transition: "all 0.3s" }}
            onMouseOver={e => { e.target.style.borderColor = accent; e.target.style.color = accent; }}
            onMouseOut={e => { e.target.style.borderColor = "#bbb"; e.target.style.color = "#666"; }}
          >↻ Refazer</button>
          {mapData.key === "antes" && (
            <button onClick={() => onSwitchTab("depois")} style={{ background: MAPS.depois.color, border: "none", borderRadius: 7, padding: "8px 18px", fontSize: 12, fontWeight: 700, color: "#fff", boxShadow: `0 2px 6px ${MAPS.depois.color}40`, transition: "filter 0.3s" }}
              onMouseOver={e => e.target.style.filter = "brightness(0.9)"}
              onMouseOut={e => e.target.style.filter = "none"}
            >{MAPS.depois.icon} Mapa Depois →</button>
          )}
        </div>
      </div>
    </div>
  );
}

/* ═══════ MAIN ═══════ */

function App() {
  const [activeTab, setActiveTab] = useState("antes");
  const wrapRef = useAutoResize();

  return (
    <div ref={wrapRef} style={{ background: "#f7f3ee", padding: "12px 10px 8px" }}>
      <div style={{ maxWidth: 500, margin: "0 auto" }}>
        <div style={{ textAlign: "center", marginBottom: 4 }}>
          <p style={{ fontSize: 10, color: "#666", letterSpacing: 1.5, textTransform: "uppercase", margin: 0 }}>Psicologias em Dia · Sentir, Pensar e Transformar</p>
        </div>
        <div style={{ display: "flex", gap: 5, marginBottom: 3, justifyContent: "center" }}>
          {["antes", "depois"].map(t => {
            const m = MAPS[t], active = activeTab === t;
            return (
              <button key={t} onClick={() => setActiveTab(t)} style={{
                padding: "8px 16px", borderRadius: 7,
                background: active ? m.color : "#fffdf9",
                color: active ? "#fff" : "#777",
                border: active ? "none" : "1.5px solid #ccc",
                fontSize: 11, fontWeight: 700,
                boxShadow: active ? `0 2px 8px ${m.color}28` : "none",
                transition: "all 0.25s ease",
              }}>
                {m.tab}
              </button>
            );
          })}
        </div>
        <MapFlow key={activeTab} mapData={MAPS[activeTab]} onSwitchTab={setActiveTab} />
        <p style={{ textAlign: "center", fontSize: 10, color: "#666", marginTop: 3, paddingBottom: 6 }}>
          © Psicologias em Dia · Ferramenta de autorreflexão — não substitui avaliação profissional.
        </p>
      </div>
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById("root"));
</script>
</body>
</html>
